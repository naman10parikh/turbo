<text x="24" y="66" fill="#7fc492">$ <tspan fill="#f3f0e8">turbo --help</tspan></text>
<text x="24" y="86" fill="#d8d3c8" xml:space="preserve">Usage: turbo [options] [command]</text>
<text x="24" y="106" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="126" fill="#d8d3c8" xml:space="preserve">turbo — the Energy fleet's backend/runtime domain-expert employee. Scaffolds &amp;</text>
<text x="24" y="146" fill="#d8d3c8" xml:space="preserve">audits TS-strict Hono services from OpenAPI.</text>
<text x="24" y="166" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="186" fill="#d8d3c8" xml:space="preserve">Options:</text>
<text x="24" y="206" fill="#d8d3c8" xml:space="preserve">  -v, --version                   print the turbo version</text>
<text x="24" y="226" fill="#d8d3c8" xml:space="preserve">  -h, --help                      display help for command</text>
<text x="24" y="246" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="266" fill="#d8d3c8" xml:space="preserve">Commands:</text>
<text x="24" y="286" fill="#d8d3c8" xml:space="preserve">  api [options]                   OpenAPI spec → typed Hono service (Zod</text>
<text x="24" y="306" fill="#d8d3c8" xml:space="preserve">                                  boundaries, no-default PATCH schema,</text>
<text x="24" y="326" fill="#d8d3c8" xml:space="preserve">                                  /openapi.json, /health, Pino)</text>
<text x="24" y="346" fill="#d8d3c8" xml:space="preserve">  scaffold [options]              stand up a blank law-compliant Hono service</text>
<text x="24" y="366" fill="#d8d3c8" xml:space="preserve">                                  (w3cj baseline, deps bumped to current pins)</text>
<text x="24" y="386" fill="#d8d3c8" xml:space="preserve">  audit [options] &lt;dir&gt;           run the KNOWN-PITFALLS detectors over a</text>
<text x="24" y="406" fill="#d8d3c8" xml:space="preserve">                                  service (P-02/P-04/P-09/SSE/RPC/CORS),</text>
<text x="24" y="426" fill="#d8d3c8" xml:space="preserve">                                  findings keyed by P-ID</text>
<text x="24" y="446" fill="#d8d3c8" xml:space="preserve">  check [options]                 version-drift oracle: flag stale pins, the</text>
<text x="24" y="466" fill="#d8d3c8" xml:space="preserve">                                  Hono security floor, and EOL runtimes</text>
<text x="24" y="486" fill="#d8d3c8" xml:space="preserve">                                  (offline-safe)</text>
<text x="24" y="506" fill="#d8d3c8" xml:space="preserve">  brain [options] &lt;query...&gt;      BM25 ranked search over the brain/ expertise</text>
<text x="24" y="526" fill="#d8d3c8" xml:space="preserve">                                  corpus (pitfalls, scenarios, opinions)</text>
<text x="24" y="546" fill="#d8d3c8" xml:space="preserve">  explain [options] &lt;id&gt;          print a pitfall/scenario/opinion by id</text>
<text x="24" y="566" fill="#d8d3c8" xml:space="preserve">                                  (P-/S-/O-) with its detection + fix</text>
