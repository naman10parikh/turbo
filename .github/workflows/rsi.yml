name: turbo RSI
# CP123 D18: the deterministic RSI loop is ENABLED + ACTUALLY RUNS here.
# `workflow_dispatch` (manual) + a weekly `schedule`. The job builds the repo then invokes the real
# engine `node workflows/rsi.workflow.js --deterministic` — it does NOT narrate a no-op guard.
# The Claude half (CLAUDE_CODE_OAUTH_TOKEN) stays dark until the chairman sets it (D8) — the
# deterministic half is $0/tokenless and is the graded ✅.
on:
  workflow_dispatch:
  schedule:
    # Weekly, Mondays 09:00 UTC — re-verify the tool matrix against the live ecosystem.
    - cron: "0 9 * * 1"

permissions:
  contents: read

jobs:
  rsi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Friendly skip ONLY if the engine isn't built yet (pre-D17). Once it exists, the engine runs.
      - name: Detect RSI engine
        id: engine
        run: |
          if [ -f workflows/rsi.workflow.js ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "RSI engine not built yet — skipping (the deterministic half lands in CP123 D17)."
          fi

      - uses: pnpm/action-setup@v4
        if: steps.engine.outputs.present == 'true'
      - uses: actions/setup-node@v4
        if: steps.engine.outputs.present == 'true'
        with:
          node-version: 24
          cache: pnpm

      - name: Install + build (the engine imports dist/)
        if: steps.engine.outputs.present == 'true'
        run: |
          pnpm install --frozen-lockfile || pnpm install
          pnpm build

      - name: Run the deterministic RSI engine (6 dsip steps, $0)
        if: steps.engine.outputs.present == 'true'
        run: node workflows/rsi.workflow.js --deterministic

      - name: Keep the proposal for review (never applied or merged by the loop)
        if: always() && steps.engine.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pin-bump-proposal
          path: .rsi/proposed/*.md
          if-no-files-found: ignore
          retention-days: 30
